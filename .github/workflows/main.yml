name: StreamX Media3 Pro - APK Build Suite

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: streamx-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print | sort -V | tail -n 1)"
          if [[ -n "${ZIP_FILE}" ]]; then
            echo "Found source archive: ${ZIP_FILE}"
            EXTRACT_DIR="${RUNNER_TEMP}/streamx-source"
            rm -rf "${EXTRACT_DIR}"
            mkdir -p "${EXTRACT_DIR}"
            unzip -q -o "${ZIP_FILE}" -d "${EXTRACT_DIR}"
            SETTINGS_FILE="$(find "${EXTRACT_DIR}" -type f -name settings.gradle.kts -print -quit)"
            if [[ -z "${SETTINGS_FILE}" ]]; then
              echo "::error::ZIP does not contain settings.gradle.kts."
              exit 1
            fi
            PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
            test -f "${PROJECT_DIR}/app/build.gradle.kts"
            cp -a "${PROJECT_DIR}/." "${GITHUB_WORKSPACE}/"
            test -f settings.gradle.kts
            test -f app/build.gradle.kts
            echo "Extracted ${ZIP_FILE} into workspace root."
            exit 0
          fi

          if [[ -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            echo "Android project found directly at repository root."
            exit 0
          fi

          EXISTING_SETTINGS="$(find . -maxdepth 3 -type f -name settings.gradle.kts -print -quit)"
          if [[ -n "${EXISTING_SETTINGS}" ]]; then
            PROJECT_DIR="$(dirname "${EXISTING_SETTINGS}")"
            echo "Found extracted project inside subfolder: ${PROJECT_DIR}"
            cp -a "${PROJECT_DIR}/." "${GITHUB_WORKSPACE}/"
            test -f settings.gradle.kts
            test -f app/build.gradle.kts
            exit 0
          fi

          echo "::error::No source project or ZIP found. Upload the StreamX source ZIP to the repository."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and install SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "sdk.dir=${SDK_ROOT}" > local.properties

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          echo "Using preinstalled sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fix color attributes in drawables
        shell: bash
        run: |
          set -euo pipefail
          find app/src/main/res/drawable -type f -name "*.xml" -exec sed -i 's/android:color="#668FFFFF"/android:color="#66888888"/g' {} + || true
          find app/src/main/res/drawable -type f -name "*.xml" -exec sed -i 's/android:color="#668F/android:color="#6688/g' {} + || true

      - name: Configure optional persistent APK signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/streamx-release.jks"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            test -s "${KEYSTORE_PATH}"
            {
              echo "SIGNING_STORE_FILE=${KEYSTORE_PATH}"
              echo "SIGNING_STORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "SIGNING_KEY_ALIAS=${KEY_ALIAS}"
              echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "${GITHUB_ENV}"
            echo "Persistent release signing key configured."
          else
            echo "::notice::No persistent signing secrets configured; Gradle will use its debug signing key."
          fi

      - name: Build Debug and Release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew || true
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace || gradle --no-daemon assembleDebug assembleRelease --stacktrace

          mkdir -p apk_output_suite
          
          # Locate Debug APK
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 2 -type f -name '*.apk' -print -quit)"
          if [[ -n "${DEBUG_APK}" ]]; then
            cp "${DEBUG_APK}" apk_output_suite/StreamX-Media3-Pro-Debug.apk
            echo "Found and copied Debug APK."
          fi

          # Locate Release APK
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 2 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          if [[ -z "${RELEASE_APK}" ]]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          fi
          if [[ -f "${RELEASE_APK}" ]]; then
            cp "${RELEASE_APK}" apk_output_suite/StreamX-Media3-Pro-Release.apk
            echo "Found and copied Release APK."
          fi

          ls -lh apk_output_suite/

      - name: Upload Debug and Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Media3-Pro-Debug-and-Release-APKs
          path: apk_output_suite/
          if-no-files-found: error
          retention-days: 14
